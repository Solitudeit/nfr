name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: End-to-end
        run: |
          go build -o bin/nfr ./cmd/nfr
          python3 scripts/e2e.py
          python3 scripts/e2e_federation.py
