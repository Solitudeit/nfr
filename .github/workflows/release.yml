name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - name: Build web console
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build release archives
        run: python3 scripts/package.py --version "${GITHUB_REF_NAME}" --out dist
      - name: Publish release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nfr-release-cleanup",
          }
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=100", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              rels = json.loads(r.read().decode())
          for rel in rels:
              if rel.get("draft") and (rel.get("name") == tag or str(rel.get("tag_name", "")).startswith("untagged-")):
                  dreq = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases/{rel['id']}",
                      headers=headers,
                      method="DELETE",
                  )
                  with urllib.request.urlopen(dreq, timeout=30) as dr:
                      dr.read()
                  print(f"deleted stale draft release id={rel['id']} name={rel.get('name')}")
          PY

          PRE_FLAG=""
          case "${TAG}" in
            *-*) PRE_FLAG="--prerelease" ;;
          esac

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            if [ -f ".github/release-notes/${TAG}.md" ]; then
              gh release edit "${TAG}" --repo "${REPO}" ${PRE_FLAG} --notes-file ".github/release-notes/${TAG}.md"
            elif [ -n "${PRE_FLAG}" ]; then
              gh release edit "${TAG}" --repo "${REPO}" ${PRE_FLAG}
            fi
          else
            if [ -f ".github/release-notes/${TAG}.md" ]; then
              gh release create "${TAG}" --repo "${REPO}" --title "${TAG}" ${PRE_FLAG} --notes-file ".github/release-notes/${TAG}.md"
            else
              gh release create "${TAG}" --repo "${REPO}" --title "${TAG}" ${PRE_FLAG} --generate-notes
            fi
          fi

          gh release upload "${TAG}" --repo "${REPO}" --clobber \
            dist/nfr_*.tar.gz \
            dist/nfr_*.zip \
            dist/nfrc_*.tar.gz \
            dist/nfrc_*.zip \
            dist/SHA256SUMS \
            scripts/install.sh \
            deploy/systemd/nfr-server.service \
            deploy/systemd/nfr-agent.service
      - name: Mark previous releases as pre-release
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nfr-release-workflow",
          }

          page = 1
          updated = 0
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rels = json.loads(resp.read().decode())
              if not rels:
                  break
              for rel in rels:
                  if rel.get("prerelease") or rel.get("draft"):
                      continue
                  patch_url = f"https://api.github.com/repos/{repo}/releases/{rel['id']}"
                  body = json.dumps({"prerelease": True}).encode()
                  preq = urllib.request.Request(
                      patch_url,
                      data=body,
                      headers={**headers, "Content-Type": "application/json"},
                      method="PATCH",
                  )
                  with urllib.request.urlopen(preq, timeout=30) as presp:
                      presp.read()
                  print(f"marked {rel.get('tag_name')} (id={rel['id']}) as prerelease")
                  updated += 1
              page += 1
          print(f"done: updated {updated} release(s) to prerelease")
          PY
      - name: Publish version.json to version-manifest branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, urllib.request

          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          token = os.environ["GH_TOKEN"]
          is_pre = "-" in tag

          notes_path = pathlib.Path(f".github/release-notes/{tag}.md")
          notes = notes_path.read_text(encoding="utf-8").strip() if notes_path.exists() else ""

          # Preserve existing stable/preview entries when updating manifest.
          manifest = {}
          try:
              req = urllib.request.Request(
                  f"https://raw.githubusercontent.com/{repo}/version-manifest/version.json",
                  headers={"User-Agent": "nfr-release-manifest"},
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  manifest = json.loads(r.read().decode())
          except Exception:
              manifest = {}

          entry = {
              "version": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": notes,
              "url": f"https://github.com/{repo}/releases/tag/{tag}",
          }
          if is_pre:
              manifest["preview"] = entry
          else:
              manifest["stable"] = entry
              manifest["preview"] = entry

          out = pathlib.Path("/tmp/nfr-version-manifest")
          out.mkdir(parents=True, exist_ok=True)
          (out / "version.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd /tmp/nfr-version-manifest
          git init -b version-manifest
          git add version.json
          git commit -m "chore(manifest): update version.json for ${TAG}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" version-manifest:version-manifest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=preview,enable=${{ contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
