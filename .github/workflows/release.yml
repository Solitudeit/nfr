name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - name: Build web console
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build release archives
        run: python3 scripts/package.py --version "${GITHUB_REF_NAME}" --out dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/nfr_*.tar.gz
            dist/nfr_*.zip
            dist/nfrc_*.tar.gz
            dist/nfrc_*.zip
            dist/SHA256SUMS
            scripts/install.sh
            deploy/systemd/nfr-server.service
            deploy/systemd/nfr-agent.service
          generate_release_notes: true
      - name: Mark previous releases as pre-release
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nfr-release-workflow",
          }

          page = 1
          updated = 0
          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rels = json.loads(resp.read().decode())
              if not rels:
                  break
              for rel in rels:
                  if rel.get("prerelease") or rel.get("draft"):
                      continue
                  patch_url = f"https://api.github.com/repos/{repo}/releases/{rel['id']}"
                  body = json.dumps({"prerelease": True}).encode()
                  preq = urllib.request.Request(
                      patch_url,
                      data=body,
                      headers={**headers, "Content-Type": "application/json"},
                      method="PATCH",
                  )
                  with urllib.request.urlopen(preq, timeout=30) as presp:
                      presp.read()
                  print(f"marked {rel.get('tag_name')} (id={rel['id']}) as prerelease")
                  updated += 1
              page += 1
          print(f"done: updated {updated} release(s) to prerelease")
          PY

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=preview,enable=${{ contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
