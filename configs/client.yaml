# NFR 客户端配置示例（YAML 格式，与 client.toml 完全等价）
# 启动命令：nfrc -c client.yaml
# 校验配置：nfrc verify -c client.yaml

server_addr: "203.0.113.10:8443"
auth_token: "change-me-to-a-strong-token"
name: "my-node"

# 必填（与 ca: true 二选一）：服务端自签证书 SHA-256 指纹
# 推荐直接从 Web 面板复制配置，或执行 `nfrc join <服务端地址> <接入码>` 自动写入真实指纹；
# 若服务端使用公共 CA / ACME 证书，可删除 pin 并设置 ca: true
pin: "change-me-to-server-cert-sha256-pin"
# ca: true

log_level: "info"

# 可选：直接声明隧道（不写也可在 Web 面板里随时增删改）
