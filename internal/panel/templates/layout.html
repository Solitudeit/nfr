{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · NFR</title>
<style>
:root{
  --bg:#0b0f14;--panel:#121821;--line:#1f2836;--text:#e6edf3;--dim:#8b98a8;
  --accent:#3ddc97;--accent2:#4c8dff;--warn:#ffb454;--bad:#ff6b6b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
header.top{display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(18,24,33,.9);position:sticky;top:0;backdrop-filter:blur(8px);z-index:9}
.brand{font-weight:700;font-size:18px;color:var(--text)}
.brand span{color:var(--accent);font-weight:600;font-size:12px;margin-left:6px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:6px 10px;border-radius:8px;color:var(--dim);font-size:14px}
nav a:hover{background:var(--panel);color:var(--text);text-decoration:none}
nav a.on{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
main{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:26px 0 10px}
.sub{color:var(--dim);font-size:13px;margin:0 0 18px}
.msg{padding:10px 14px;border-radius:10px;margin:0 0 16px;font-size:14px;border:1px solid}
.msg.err{border-color:#5a2730;background:#2a1216;color:#ffb3b3}
.msg.ok{border-color:#1d4a38;background:#0f2a20;color:#a8f0cf}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card .k{color:var(--dim);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.card .v{font-size:24px;font-weight:650;margin-top:4px}
.card .c{color:var(--dim);font-size:12px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pick{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--text)}
.pick:hover{border-color:var(--accent2);text-decoration:none}
.pick .t{font-weight:650;font-size:16px}
.pick .u{color:var(--dim);font-size:12px;word-break:break-all;margin:4px 0 10px}
.rowform{display:grid;gap:12px;max-width:560px}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
input,select,textarea{width:100%;background:#0d131b;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
.inline{display:flex;gap:10px;align-items:center}
.inline input{flex:1}
button,.btn{background:var(--accent);color:#04231a;border:0;border-radius:9px;padding:9px 16px;font-weight:650;font:inherit;cursor:pointer}
button.ghost,.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
button.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px #4a2430}
button:hover{filter:brightness(1.08)}
button.sm{padding:5px 10px;font-size:13px;border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#0f151d}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--dim)}
.badge.on{color:var(--accent);border-color:#1d4a38;background:#0f2a20}
.badge.off{color:var(--dim)}
.badge.err{color:var(--bad);border-color:#4a2430;background:#2a1216}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;letter-spacing:.35em;color:var(--accent);font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.split{grid-template-columns:1fr}nav a{padding:5px 7px}}
.muted{color:var(--dim)}
.scroll{overflow-x:auto}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.login h1{margin-bottom:2px}
.foot{color:var(--dim);font-size:12px;margin-top:26px}
</style>
</head>
<body>
{{if ne .Page "login"}}
<header class="top">
  <a class="brand" href="/_nfr/">NFR<span>control</span></a>
  <nav>
    <a href="/_nfr/overview" class="{{if eq .Nav "overview"}}on{{end}}">Overview</a>
    <a href="/_nfr/tunnels" class="{{if eq .Nav "tunnels"}}on{{end}}">Tunnels</a>
    <a href="/_nfr/nodes" class="{{if eq .Nav "nodes"}}on{{end}}">Nodes</a>
    <a href="/_nfr/servers" class="{{if eq .Nav "servers"}}on{{end}}">Servers</a>
    <a href="/_nfr/settings" class="{{if eq .Nav "settings"}}on{{end}}">Settings</a>
    <a href="/_nfr/keys" class="{{if eq .Nav "keys"}}on{{end}}">API</a>
  </nav>
</header>
{{end}}
<main>
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
{{if .Notice}}<div class="msg ok">{{.Notice}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
