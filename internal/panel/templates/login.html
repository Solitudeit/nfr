<div class="login">
  <form class="login-card" method="post" action="/nfr/login">
    <div class="login-wordmark">
      <span class="brand-mark">N</span>
      <span class="brand-name">NFR</span>
    </div>
    <div class="card-head"><h2>登录控制台</h2></div>
    {{if .Error}}<div class="flash err" role="alert">{{.Error}}</div>{{end}}
    <div class="field">
      <label for="pw">面板密码</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
    </div>
    <button class="btn primary" type="submit">登录</button>
    <p class="login-foot">密码在首次启动时随日志打印一次。</p>
  </form>
</div>
