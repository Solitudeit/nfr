<div class="login-page">
  <div class="login-topbar">
    <div class="login-status-pill">
      <span class="live-dot" aria-hidden="true"></span>
      <span>nfrs · control plane</span>
    </div>
    <button class="icon-btn" type="button" data-theme-toggle title="切换深色 / 浅色" aria-label="切换深色 / 浅色">
      {{template "i-moon"}}{{template "i-sun"}}
    </button>
  </div>

  <div class="login-wrap">
    <form class="login-card" method="post" action="/nfr/login">
      <div class="login-head">
        <span class="brand-logo lg" aria-hidden="true">{{template "i-logo"}}</span>
        <div>
          <h1>NFR 控制台</h1>
          <p>请输入管理员密码以进入控制面</p>
        </div>
      </div>

      {{if .Error}}<div class="flash err" role="alert" tabindex="-1" data-focus-err><span class="flash-body">{{.Error}}</span></div>{{end}}

      <div class="field">
        <label for="pw">面板密码</label>
        <div class="pw-wrap">
          <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="输入管理员密码" autofocus required>
          <button type="button" class="pw-toggle" data-pw-toggle="pw" aria-label="显示或隐藏密码" aria-pressed="false" title="显示 / 隐藏密码">{{template "i-eye"}}</button>
        </div>
      </div>

      <button class="btn primary full lg" type="submit">登录控制台</button>

      <div class="login-foot">
        <p>首次启动时密码会输出在服务端日志中。</p>
        <p>忘记密码可在服务端运行 <code>nfrs reset-password</code> 重置。</p>
      </div>
    </form>
  </div>
</div>
