# NFR Docker Compose deployment examples.
#
# Public server (control node):
#   NFR_PASSWORD='change-me-now' docker compose -f deploy/docker/compose.yml up -d nfrs
#
# Private client (inside your LAN, uncomment or run with `--profile client`):
#   NFR_SERVER='203.0.113.10:8443' NFR_CODE='ABC123' \
#     docker compose -f deploy/docker/compose.yml --profile client up -d nfrc
#
# Note: host networking lets nfrs bind arbitrary tunnel ports in port_range
# (20000-29999) without mapping 10,000 Docker proxy ports, and lets nfrc dial
# 127.0.0.1:<port> services on the host directly.

services:
  nfrs:
    image: ghcr.io/solitudeit/nfr:latest
    container_name: nfr-server
    restart: unless-stopped
    network_mode: host
    environment:
      # Set on first run so you do not have to hunt for a random password in logs.
      NFR_PASSWORD: "${NFR_PASSWORD:-}"
      # Optional: public domain or IP visitors dial to reach tunnels.
      NFR_DOMAIN: "${NFR_DOMAIN:-}"
      NFR_PUBLIC_HOST: "${NFR_PUBLIC_HOST:-}"
      # Optional: override listen addresses (set "off" to coexist with nginx/Caddy).
      NFR_CONTROL_LISTEN: "${NFR_CONTROL_LISTEN:-:8443}"
      NFR_HTTP_LISTEN: "${NFR_HTTP_LISTEN:-:80}"
      NFR_HTTPS_LISTEN: "${NFR_HTTPS_LISTEN:-:443}"
      NFR_DATA_DIR: "/var/lib/nfr"
    volumes:
      - nfr-server-data:/var/lib/nfr

  nfrc:
    image: ghcr.io/solitudeit/nfr:latest
    container_name: nfr-client
    profiles: ["client"]
    restart: unless-stopped
    network_mode: host
    entrypoint: ["nfrc"]
    command: ["-c", "/var/lib/nfr/agent.toml"]
    environment:
      # Used only on first start when agent.toml has no server yet.
      # Subsequent restarts reconnect with the saved token automatically.
      NFR_SERVER: "${NFR_SERVER:-}"
      NFR_CODE: "${NFR_CODE:-}"
      NFR_NAME: "${NFR_NAME:-}"
    volumes:
      - nfr-client-data:/var/lib/nfr

volumes:
  nfr-server-data:
  nfr-client-data:
