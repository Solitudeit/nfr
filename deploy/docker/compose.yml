# NFR Docker Compose deployment examples.
#
# Public server (control node):
#   NFR_PASSWORD='change-me-now' NFR_AUTH_TOKEN='my-shared-token' \
#     docker compose -f deploy/docker/compose.yml up -d nfrs
#
# Private client (inside your LAN; pass NFR_PIN for self-signed cert or NFR_CA=true for ACME):
#   NFR_SERVER='203.0.113.10:8443' NFR_AUTH_TOKEN='my-shared-token' NFR_PIN='<server-sha256-pin>' NFR_NAME='homelab' \
#     docker compose -f deploy/docker/compose.yml --profile client up -d nfrc
#
# You can also mount a TOML or YAML config file directly, e.g.:
#   - ./client.yaml:/etc/nfr/client.yaml:ro
#   command: ["-c", "/etc/nfr/client.yaml"]

services:
  nfrs:
    image: ghcr.io/solitudeit/nfr:latest
    container_name: nfr-server
    restart: unless-stopped
    network_mode: host
    environment:
      NFR_PASSWORD: "${NFR_PASSWORD:-}"
      NFR_AUTH_TOKEN: "${NFR_AUTH_TOKEN:-}"
      NFR_DOMAIN: "${NFR_DOMAIN:-}"
      NFR_PUBLIC_HOST: "${NFR_PUBLIC_HOST:-}"
      NFR_CONTROL_LISTEN: "${NFR_CONTROL_LISTEN:-:8443}"
      NFR_HTTP_LISTEN: "${NFR_HTTP_LISTEN:-:80}"
      NFR_HTTPS_LISTEN: "${NFR_HTTPS_LISTEN:-:443}"
      NFR_DATA_DIR: "/var/lib/nfr"
    volumes:
      - nfr-server-data:/var/lib/nfr

  nfrc:
    image: ghcr.io/solitudeit/nfr:latest
    container_name: nfr-client
    profiles: ["client"]
    restart: unless-stopped
    network_mode: host
    entrypoint: ["nfrc"]
    command: ["-c", "/etc/nfr/client.toml"]
    environment:
      NFR_SERVER: "${NFR_SERVER:-}"
      NFR_AUTH_TOKEN: "${NFR_AUTH_TOKEN:-}"
      NFR_NAME: "${NFR_NAME:-}"
      NFR_PIN: "${NFR_PIN:-}"
      NFR_CA: "${NFR_CA:-}"
    volumes:
      - nfr-client-data:/etc/nfr

volumes:
  nfr-server-data:
  nfr-client-data:
